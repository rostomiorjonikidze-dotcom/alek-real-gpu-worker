name: Validate ALEK REAL worker
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check syntax
        run: python -m compileall -q handler.py worker.py tests
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run unit tests
        run: python -m pytest -q tests
      - name: Verify Runpod entrypoint
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          code = Path("handler.py").read_text()
          assert 'runpod.serverless.start' in code
          tree = ast.parse(code)
          assert any(isinstance(n, ast.FunctionDef) and n.name == 'handler' for n in tree.body)
          assert 'handler.py' in Path('Dockerfile').read_text()
          print('Runpod handler entrypoint present')
          PY
